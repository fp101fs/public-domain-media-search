
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Search Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        #search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        #query { padding: 0.5rem; width: 300px; font-size: 1rem; }
        #searchBtn { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
        #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
        .item { text-align: center; }
        .item img { max-width: 100%; height: auto; border: 1px solid #ccc; }
        .item a { display: block; margin-top: 0.5rem; font-size: 0.85rem; word-break: break-all; }
        .item .meta { font-size: 0.8rem; color: #555; margin-top: 0.3rem; }
        .loading { text-align: center; padding: 2rem; font-style: italic; }
        .error { color: red; text-align: center; padding: 1rem; }
        .tabs { display: flex; border-bottom: 1px solid #ccc; margin-bottom: 1rem; }
        .tab-button { padding: 0.5rem 1rem; cursor: pointer; border: none; background: #f0f0f0; }
        .tab-button.active { background: #e0e0e0; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <h1>Image Search Demo</h1>
    <div class="tabs">
        <button class="tab-button active" data-tab="wikimedia">Wikimedia</button>
        <button class="tab-button" data-tab="openverse">Openverse</button>
        <button class="tab-button" data-tab="loc">Library of Congress</button>
        <button class="tab-button" data-tab="nasa">NASA Images</button>
    </div>
    <div id="search-box">
        <input type="text" id="query" placeholder="Enter search term (e.g., ancient Rome)" />
        <button id="searchBtn">Search</button>
    </div>
    <div id="media-type-box" style="display:block; margin-bottom:1rem;">
        <label><input type="radio" name="mediaType" value="images" checked /> Images</label>
        <label style="margin-left:1rem;"><input type="radio" name="mediaType" value="videos" /> Videos</label>
        <label style="margin-left:1rem;"><input type="radio" name="mediaType" value="both" /> Both</label>
    </div>
    <div id="status"></div>
    <div id="wikimedia-results" class="tab-content active"></div>
    <div id="openverse-results" class="tab-content"></div>
    <div id="loc-results" class="tab-content"></div>
    <div id="nasa-results" class="tab-content"></div>

        <script>
        // Tab switching
        function showTab(tabName) {
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === tabName + '-results');
            });
        }

        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                showTab(tab);
                // Media-type radio (images/videos/both) only applies to Wikimedia,
                // since that's the only source here with a working video search.
                document.getElementById('media-type-box').style.display = tab === 'wikimedia' ? 'block' : 'none';
                // Clear previous results when switching tabs? optional
                document.getElementById(tab + '-results').innerHTML = '';
                document.getElementById('status').textContent = '';
            });
        });

        // Search handlers
        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('query').addEventListener('keypress', e => {
            if (e.key === 'Enter') performSearch();
        });

        async function performSearch() {
            const query = document.getElementById('query').value.trim();
            if (!query) {
                alert('Please enter a search term');
                return;
            }
            const statusEl = document.getElementById('status');
            const activeTab = document.querySelector('.tab-button.active').dataset.tab;
            const resultsEl = document.getElementById(activeTab + '-results');
            statusEl.textContent = 'Searching...';
            resultsEl.innerHTML = '';

            try {
                let items = [];
                if (activeTab === 'wikimedia') {
                    const mediaType = document.querySelector('input[name="mediaType"]:checked').value;
                    items = await fetchWikimedia(query, mediaType);
                } else if (activeTab === 'openverse') {
                    items = await fetchOpenverse(query);
                } else if (activeTab === 'loc') {
                    items = await fetchLOC(query);
                } else if (activeTab === 'nasa') {
                    items = await fetchNASA(query);
                }

                if (items.length === 0) {
                    statusEl.textContent = 'No results found.';
                    return;
                }
                statusEl.textContent = `${items.length} result(s)`;
                resultsEl.innerHTML = items.map(item => `
                    <div class="item">
                        ${item.type === 'video'
                            ? `<video src="${item.url}" poster="${item.thumb}" controls preload="metadata" style="max-width:100%"></video>
                               <a href="${item.url}" target="_blank" rel="noopener">Open video file</a>`
                            : `<a href="${item.url}" target="_blank" rel="noopener">
                                <img src="${item.thumb}" alt="${item.title}" />
                               </a>`}
                        <div class="meta">
                            <strong>${item.title}</strong><br/>
                            ${item.author ? `By: ${item.author}<br/>` : ''}
                            ${item.license ? `License: ${item.license}<br/>` : ''}
                            <a href="${item.sourceUrl}" target="_blank" rel="noopener">View source</a>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                statusEl.textContent = '';
                resultsEl.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        // Fetch functions
        async function wikimediaSearch(gsrsearch, limit) {
            const response = await fetch(
                'https://commons.wikimedia.org/w/api.php?' +
                new URLSearchParams({
                    action: 'query',
                    generator: 'search',
                    gsrsearch,
                    gsrnamespace: '6', // File namespace
                    gsrlimit: String(limit),
                    prop: 'imageinfo',
                    iiprop: 'url|extmetadata|mediatype',
                    iiurlwidth: '300',
                    format: 'json',
                    origin: '*'
                })
            );
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const pages = data.query && data.query.pages;
            if (!pages) return [];
            const items = [];
            for (const pageId in pages) {
                const p = pages[pageId];
                const title = p.title || '';
                const ii = p.imageinfo && p.imageinfo[0];
                if (!ii) continue;
                const url = ii.url || '';
                const thumb = ii.thumburl || ii.url;
                const meta = ii.extmetadata || {};
                const author = meta.Artist ? meta.Artist.value : '';
                const license = meta.LicenseShortName ? meta.LicenseShortName.value : '';
                // filter: only public domain or CC0
                if (license !== 'Public domain' && license !== 'CC0') continue;
                // .ogv (Theora) files have no video decoder in Chrome — audio plays but
                // the frame stays black, so skip them rather than show a broken result.
                if (/\.ogv$/i.test(title)) continue;
                const sourceUrl = `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(title.replace(/^File:/, ''))}`;
                const type = ii.mediatype === 'VIDEO' ? 'video' : 'image';
                items.push({ url, thumb, title, author, license, sourceUrl, type });
            }
            return items;
        }

        async function fetchWikimedia(query, mediaType = 'images') {
            if (mediaType === 'images') {
                return wikimediaSearch(query, 20);
            }
            if (mediaType === 'videos') {
                return wikimediaSearch(`filetype:video ${query}`, 20);
            }
            // 'both' — run image and video searches in parallel and merge.
            const [images, videos] = await Promise.all([
                wikimediaSearch(query, 10),
                wikimediaSearch(`filetype:video ${query}`, 10)
            ]);
            return [...images, ...videos];
        }

        async function fetchOpenverse(query) {
            const response = await fetch(
                'https://api.openverse.org/v1/images/?' +
                new URLSearchParams({
                    q: query,
                    // cc0 = public domain dedication, pdm = public domain mark (no known copyright)
                    license: 'cc0,pdm',
                    page_size: '10'
                })
            );
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const results = data.results || [];
            return results.map(r => ({
                url: r.url || '',
                thumb: r.thumbnail || r.url || '',
                title: r.title || '',
                author: r.creator || '',
                license: r.license || '',
                sourceUrl: r.url || ''
            }));
        }

        // LOC's search API sits behind Cloudflare bot protection that blocks
        // browser-side cross-origin access both ways:
        //   - fetch(): no Access-Control-Allow-Origin on the response the browser
        //     actually receives (curl gets it; real browser requests get challenged)
        //   - JSONP via <script src>: the response Content-Type is always
        //     application/json (with nosniff), so Chrome's ORB blocks executing it
        //     as a script regardless of the callback wrapper — this is not
        //     intermittent, it structurally can't work.
        // Public CORS proxies (allorigins, corsproxy.io, corsfix, codetabs, etc.)
        // were tried and are either down or themselves get Cloudflare-challenged by
        // loc.gov, since it blocks known datacenter/proxy IP ranges. There is no
        // reliable pure-front-end fix here; a real fix needs a backend/proxy you
        // control (e.g. a small Cloudflare Worker) to relay the request server-side.
        // This still attempts a direct fetch — it'll work if LOC's bot protection
        // ever loosens for your network — and fails with a clear message otherwise.
        // LOC's search API also has no license/rights query filter, so "public
        // domain only" has to be applied client-side (see filter below).
        async function fetchLOC(query) {
            const baseUrl = 'https://www.loc.gov/photos/';
            const params = new URLSearchParams({
                q: query,
                fo: 'json',
                c: '25'
            });
            const url = `${baseUrl}?${params.toString()}`;
            let response;
            try {
                response = await fetch(url);
            } catch (e) {
                throw new Error('Library of Congress blocked this request (their site blocks cross-origin browser access). This tab cannot work without a server-side proxy you control.');
            }
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const results = (data.content && data.content.results) || [];

            const filtered = results.filter(r => {
                if (r.access_restricted) return false;
                const item = r.item || {};
                // Presence of a rights_advisory/rights_information note means usage is
                // restricted in some way; only keep items with none, i.e. public domain
                // / no known restrictions.
                const advisory = item.rights_advisory || item.rights_information;
                if (advisory && (Array.isArray(advisory) ? advisory.length : true)) return false;
                return true;
            });

            return filtered
                .filter(r => r.image_url && r.image_url.length)
                .map(r => {
                    const images = r.image_url;
                    const thumb = images[0] || '';
                    const full = images[images.length - 1] || thumb;
                    const title = r.title || '';
                    const item = r.item || {};
                    const author = (item.contributors && item.contributors[0]) ||
                        (item.creators && item.creators[0] && item.creators[0].title) || '';
                    const license = 'Public domain / no known restrictions';
                    let sourceUrl = r.url || item.link || '';
                    if (sourceUrl.startsWith('//')) sourceUrl = 'https:' + sourceUrl;
                    return { url: full, thumb, title, author, license, sourceUrl };
                });
        }

        async function fetchNASA(query) {
            const encodedQuery = encodeURIComponent(query);
            const url = `https://images-api.nasa.gov/search?q=${encodedQuery}&page=1&media_type=image`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const items = (data.collection && data.collection.items) || [];

            return items.map(item => {
                const d = (item.data && item.data[0]) || {};
                const title = d.title || 'Untitled';
                const author = d.photographer || d.secondary_creator || (d.center ? `NASA ${d.center}` : 'NASA');
                const license = 'Public domain (NASA)';
                const nasaId = d.nasa_id || '';
                const sourceUrl = nasaId ? `https://images.nasa.gov/details/${encodeURIComponent(nasaId)}` : 'https://images.nasa.gov/';

                let thumb = '';
                let fullUrl = '';
                if (item.links && item.links.length > 0) {
                    const previewLink = item.links.find(l => l.rel === 'preview') || item.links[0];
                    thumb = previewLink ? previewLink.href : '';
                    const origLink = item.links.find(l => l.rel === 'canonical');
                    fullUrl = origLink ? origLink.href : thumb;
                }

                return {
                    url: fullUrl || thumb,
                    thumb: thumb || fullUrl,
                    title,
                    author,
                    license,
                    sourceUrl,
                    type: 'image'
                };
            }).filter(item => item.thumb);
        }
        </script>
</body>
</html>
